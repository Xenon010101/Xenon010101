<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" fill="none" role="img" aria-labelledby="title desc">
<title id="title">focustube</title><desc id="desc">A luminous play symbol sits within quiet concentric frames.</desc>
