<svg xmlns="http://www.w3.org/2000/svg" width="640" height="700" viewBox="0 0 640 700" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Anmol Patel | Engineered Intelligence</title>
<desc id="desc">Minimal red and charcoal GitHub profile hero for Anmol Patel. AI, full-stack and open source.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A0F14"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF4757"/><stop offset="1" stop-color="#D93649"/></linearGradient>
  <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" stroke="#22303B" stroke-width=".6" opacity=".42"/></pattern>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="frame"><rect x="16" y="18" width="608" height="664" rx="16"/></clipPath>
</defs>
<rect width="640" height="700" fill="url(#bg)"/>
<rect x="16" y="18" width="608" height="664" rx="16" stroke="#30363D"/>
<g clip-path="url(#frame)">
  <rect x="16" y="18" width="608" height="664" fill="url(#grid)" opacity=".34"/>

  <!-- header -->
  <rect x="36" y="40" width="132" height="34" rx="7" fill="#0B1016" stroke="#39424C"/>
  <text x="52" y="62" fill="#FF4757" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" letter-spacing="1.6">XENON010101</text>
  <path d="M184 44V70" stroke="#4A535D"/>
  <text x="200" y="62" fill="#AAB6C4" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="2.2">ENGINEERED INTELLIGENCE</text>

  <!-- main identity -->
  <text x="38" y="152" fill="#F0F6FC" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-3">Anmol</text>
  <text x="38" y="225" fill="url(#red)" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-3">Patel</text>
  <text x="40" y="258" fill="#E6EDF3" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="4">AI / FULL-STACK / OPEN SOURCE</text>

  <!-- compact action row -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#D6DEE7">
    <rect x="38" y="281" width="118" height="36" rx="8" fill="#0B1016" stroke="#61303A"/>
    <path d="M54 292H70V306H54Z" stroke="#FF4757"/><path d="M58 296L62 299L58 302M64 303H68" stroke="#FF4757" stroke-width="1.4"/>
    <text x="79" y="304">Build</text>

    <rect x="166" y="281" width="118" height="36" rx="8" fill="#0B1016" stroke="#39424C"/>
    <path d="M181 293Q188 289 195 293V306Q188 302 181 306ZM195 293Q202 289 209 293V306Q202 302 195 306Z" stroke="#7D8A99"/>
    <text x="216" y="304">Learn</text>

    <rect x="294" y="281" width="136" height="36" rx="8" fill="#0B1016" stroke="#39424C"/>
    <circle cx="311" cy="297" r="4" stroke="#7D8A99"/><circle cx="322" cy="297" r="4" stroke="#7D8A99"/><path d="M304 308Q311 302 318 308M315 308Q322 302 329 308" stroke="#7D8A99"/>
    <text x="338" y="304">Collaborate</text>

    <rect x="440" y="281" width="162" height="36" rx="8" fill="#0B1016" stroke="#61303A"/>
    <circle cx="459" cy="299" r="9" stroke="#FF4757"/><circle cx="459" cy="299" r="4" stroke="#FF4757"/><path d="M459 299L468 290M466 289H471V294" stroke="#FF4757" stroke-width="1.5"/>
    <text x="478" y="304">Create Impact</text>
  </g>

  <path d="M38 339H602" stroke="#343B44"/>
  <path d="M38 339H84" stroke="#FF4757" stroke-width="2.2"/>

  <!-- statement -->
  <text x="38" y="381" fill="#F0F6FC" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="750">Building intelligent tools.</text>
  <text x="38" y="414" fill="#FF4757" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="750">Shipping useful software.</text>

  <!-- description -->
  <text x="39" y="446" fill="#B8C2CD" font-family="Consolas, 'Courier New', monospace" font-size="12.3">
    <tspan x="39" dy="0">I’m Anmol Patel, an AI-focused full-stack developer and</tspan>
    <tspan x="39" dy="20">open-source contributor. I build AI tools, backend APIs,</tspan>
    <tspan x="39" dy="20">and web &amp; mobile experiences—from sketch to deployment.</tspan>
  </text>

  <!-- code panel -->
  <g transform="translate(38 523)">
    <rect width="278" height="112" rx="9" fill="#0A0F14" stroke="#30363D"/>
    <path d="M0 28H278" stroke="#202832"/>
    <circle cx="16" cy="14" r="4" fill="#FF4757"/><circle cx="30" cy="14" r="4" fill="#67717C"/><circle cx="44" cy="14" r="4" fill="#3D4650"/>
    <text x="18" y="49" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#C5CFDA"><tspan fill="#FF4757">while</tspan><tspan> (curiosity) {</tspan></text>
    <text x="34" y="69" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#C5CFDA"><tspan fill="#FF4757">ideas</tspan><tspan> = brainstorm();</tspan></text>
    <text x="34" y="89" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#C5CFDA"><tspan fill="#FF4757">code</tspan><tspan> = build(ideas);</tspan></text>
    <text x="34" y="106" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#C5CFDA"><tspan fill="#FF4757">ship</tspan><tspan>(code); }</tspan></text>
  </g>

  <!-- philosophy + mountain path -->
  <g transform="translate(335 515)">
    <text x="0" y="14" fill="#8F9CAB" font-family="Consolas, 'Courier New', monospace" font-size="11.5" letter-spacing="1.6">// BUILD  // LEARN</text>
    <text x="0" y="31" fill="#8F9CAB" font-family="Consolas, 'Courier New', monospace" font-size="11.5" letter-spacing="1.6">// SHIP   // REPEAT</text>

    <!-- restrained mountain contours -->
    <path d="M0 136C30 126 49 119 72 103C91 90 101 95 118 84C141 69 157 66 177 52C194 41 210 32 231 22C245 14 258 10 269 7" stroke="#5E242E" stroke-width="1"/>
    <path d="M0 149C31 138 58 132 84 118C105 107 120 106 142 91C163 77 183 69 202 55C223 40 244 31 271 18" stroke="#8F2C39" stroke-width="1" opacity=".9"/>
    <path d="M0 160C38 149 76 145 108 133C137 122 150 110 174 96C199 82 216 71 237 51C249 39 260 31 271 24" stroke="#C33445" stroke-width="1.2" opacity=".9"/>
    <path d="M6 168C41 159 73 156 108 146C145 135 175 119 196 104C217 90 229 78 242 61C251 49 261 39 271 31" stroke="#FF4757" stroke-width="1.4"/>
    <!-- winding path -->
    <path d="M42 168C79 157 117 148 139 132C155 120 163 107 178 97C192 88 199 81 207 72C215 63 220 55 229 47C239 38 250 33 263 26" stroke="#FF4757" stroke-width="2" fill="none" filter="url(#softGlow)"/>
    <circle cx="42" cy="168" r="3" fill="#FF4757"/>
    <circle cx="178" cy="97" r="3" fill="#FF4757"/>
    <path d="M263 26V11" stroke="#FF4757" stroke-width="1.3"/><path d="M264 12L277 15L264 20Z" fill="#FF4757"/>
  </g>

  <path d="M36 654H604" stroke="#343B44"/>
  <text x="38" y="674" fill="#9AA7B5" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="1.5">CURIOSITY → CODE → IMPACT</text>
</g>
</svg>
